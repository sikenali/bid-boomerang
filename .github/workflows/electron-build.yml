name: Electron Desktop Build

on:
  push:
    branches: [main, master]
    paths:
      - 'bid-extractor/**'
      - 'bid-maker/**'
      - 'bid-compare/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: [bid-extractor, bid-maker, bid-compare]
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libxtst6 xdg-utils libasound2-dev libdbus-glib-1-dev

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Build desktop client
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run build:desktop:win
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npm run build:desktop:linux
          elif [ "${{ matrix.app }}" = "bid-maker" ]; then
            node scripts/package-desktop.js --mac
          else
            npm run build:desktop:mac
          fi
        working-directory: ${{ matrix.app }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.os }}
          path: ${{ matrix.app }}/release
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: bid-*-*

      - name: List built packages
        run: find releases -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/bid-*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
