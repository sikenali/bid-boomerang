name: Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: '版本号(如 v1.0.1);留空则使用 package.json 版本'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 (exe)
            arch: win-x64
            flag: --win --x64
          - os: ubuntu-22.04
            label: Linux x64 (deb + AppImage)
            arch: linux-x64
            flag: --linux --x64
          - os: macos-14
            label: macOS x64 + arm64 (dmg)
            arch: mac-universal
            flag: --mac --x64 --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Package (${{ matrix.flag }})
        # 脚本内部:构建主壳前端(vite build) -> electron-builder 出包
        run: node scripts/package-desktop.cjs ${{ matrix.flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_version || '' }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.arch }}
          # 只上传安装包,排除 win-unpacked / linux-unpacked / mac-*.app 等中间产物
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: desktop-*
          merge-multiple: true

      - name: List built packages
        run: find releases -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 桌面客户端构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 产物清单" >> "$GITHUB_STEP_SUMMARY"
          ls -1 releases | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows x64：\.exe 安装包" >> "$GITHUB_STEP_SUMMARY"
          echo "- Linux x64：\.AppImage 与 \.deb" >> "$GITHUB_STEP_SUMMARY"
          echo "- macOS：Intel(x64) 与 Apple Silicon(arm64) \.dmg" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 [点击下载](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
